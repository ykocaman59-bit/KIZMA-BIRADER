<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kızma Birader PRO</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
        body { background: #1a1a1a; color: #fff; text-align: center; padding: 5px; }
        h1 { font-size: 22px; color: #f1c40f; margin: 5px 0; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }

        /* GİRİŞ VE AYARLAR MENÜSÜ */
        #settings-menu { background: #2c3e50; padding: 15px; border-radius: 12px; max-width: 440px; margin: 10px auto; border: 2px solid #34495e; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .menu-title { color: #f1c40f; margin-bottom: 12px; font-size: 18px; }
        .setup-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding: 10px; border-radius: 8px; font-weight: bold; }
        .p1 { background: #c0392b; border-left: 6px solid #ff4d4d; }
        .p2 { background: #2980b9; border-left: 6px solid #3399ff; }
        .p3 { background: #27ae60; border-left: 6px solid #2ecc71; }
        .p4 { background: #d35400; border-left: 6px solid #f1c40f; }
        input[type="text"] { padding: 6px; width: 120px; border-radius: 4px; border: none; background: #fff; color: #333; font-weight: bold; }
        .bot-lbl { display: flex; align-items: center; gap: 4px; font-size: 13px; cursor: pointer; }
        .bot-lbl input { width: 16px; height: 16px; }
        .btn-start { background: #27ae60; color: white; border: none; padding: 12px; font-size: 18px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; margin-top: 10px; box-shadow: 0 3px 0 #1e7e43; }
        .btn-start:active { transform: translateY(2px); box-shadow: none; }

        /* OYUN ALANI */
        #game-container { display: none; max-width: 450px; margin: 0 auto; }
        #status-bar { background: #2c3e50; padding: 10px; border-radius: 6px; margin-bottom: 8px; font-weight: bold; font-size: 14px; border: 1px solid #34495e; box-shadow: inset 0 2px 4px rgba(0,0,0,0.3); }

        /* HARİTA 15x15 LUDO TAHTASI */
        #ludo-board { 
            display: grid; 
            grid-template-columns: repeat(15, 1fr); 
            grid-template-rows: repeat(15, 1fr); 
            width: 100%; 
            aspect-ratio: 1/1; 
            background: #fff; 
            border: 6px solid #2c3e50;
            border-radius: 8px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            position: relative;
        }

        /* Hücre Tasarımları */
        .cell { background: #ffffff; border: 1px solid #bdc3c7; display: flex; justify-content: center; align-items: center; position: relative; }
        
        /* Renk Tanımlamaları */
        .c-red { background: #ff4d4d !important; }
        .c-blue { background: #3399ff !important; }
        .c-green { background: #2ecc71 !important; }
        .c-yellow { background: #f1c40f !important; }
        .c-white { background: #ffffff !important; }

        /* Yıldız Karesi Tasarımı */
        .star-cell::before {
            content: "★";
            font-size: 16px;
            color: #7f8c8d;
            position: absolute;
            opacity: 0.6;
            font-weight: bold;
        }

        /* Ev Kaleleri (6x6 Bloklar) */
        .nest { grid-column: span 6; grid-row: span 6; display: grid; grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(2, 1fr); gap: 12px; padding: 14px; }
        .nest-red { background: #ff4d4d; }
        .nest-green { background: #2ecc71; }
        .nest-blue { background: #3399ff; }
        .nest-yellow { background: #f1c40f; }
        .pocket { background: #fff; border-radius: 50%; border: 2px solid #333; display: flex; justify-content: center; align-items: center; box-shadow: inset 0 2px 5px rgba(0,0,0,0.3); }

        /* Merkez Üçgenler */
        .center-triangle-container { grid-column: span 3; grid-row: span 3; position: relative; background: #fff; border: 1px solid #bdc3c7; }
        .triangle-svg { width: 100%; height: 100%; position: absolute; top:0; left:0; }

        .home-target-zone { position: absolute; width: 30%; height: 30%; display: flex; justify-content: center; align-items: center; z-index: 5; }
        .target-red { left: 5%; top: 35%; }
        .target-green { left: 35%; top: 5%; }
        .target-yellow { right: 5%; top: 35%; }
        .target-blue { left: 35%; bottom: 5%; }

        /* PİYONLAR VE ÜST ÜSTE BİNME DÜZENİ */
        .pawn {
            width: 75%;
            height: 75%;
            border-radius: 50%;
            border: 2px solid #fff;
            box-shadow: 0 3px 5px rgba(0,0,0,0.4), inset 0 -2px 4px rgba(0,0,0,0.3);
            cursor: pointer;
            z-index: 20;
            position: absolute; /* Üst üste binme yığınlaması için absolute yapıldı */
            transition: transform 0.15s ease;
        }
        .pawn::after { content: ''; display: block; width: 40%; height: 40%; background: rgba(255,255,255,0.4); border-radius: 50%; margin: 15% auto 0 auto; }
        .pawn.movable { animation: bounce 0.4s infinite alternate; box-shadow: 0 0 10px #fff; z-index: 30; }
        
        .pawn-red { background: #c0392b; }
        .pawn-blue { background: #2980b9; }
        .pawn-green { background: #27ae60; }
        .pawn-yellow { background: #d35400; }

        @keyframes bounce { from { transform: scale(1); } to { transform: scale(1.15); } }

        /* PANEL */
        #control-panel { display: flex; justify-content: space-between; align-items: center; background: #2c3e50; padding: 12px; border-radius: 8px; margin-top: 10px; border: 1px solid #34495e; }
        #dice-btn { background: #e67e22; color: white; border: none; padding: 10px 20px; font-size: 16px; font-weight: bold; border-radius: 5px; cursor: pointer; box-shadow: 0 3px 0 #d35400; width: 45%; }
        #dice-btn:disabled { background: #7f8c8d; box-shadow: none; cursor: not-allowed; }
        #dice-result-box { width: 45%; display: flex; justify-content: center; align-items: center; gap: 10px; font-size: 18px; font-weight: bold; }
        .dice-graphic { width: 40px; height: 40px; background: white; border-radius: 6px; border: 2px solid #333; display: flex; justify-content: center; align-items: center; font-size: 24px; color: #000; box-shadow: 0 3px 5px rgba(0,0,0,0.3); }
    </style>
</head>
<body>

    <h1>Kızma Birader PRO</h1>

    <div id="settings-menu">
        <h3 class="menu-title">⚙️ Oyuncu Ayarları</h3>
        
        <div class="setup-row p1">
            <span>1. Takım (Kırmızı):</span>
            <input type="text" id="p1-name" placeholder="Yusuf">
            <label class="bot-lbl"><input type="checkbox" id="p1-bot"> Bot yap</label>
        </div>

        <div class="setup-row p2">
            <span>2. Takım (Mavi):</span>
            <input type="text" id="p2-name" placeholder="Player 2">
            <label class="bot-lbl"><input type="checkbox" id="p2-bot"> Bot yap</label>
        </div>

        <div class="setup-row p3">
            <label style="cursor:pointer;"><input type="checkbox" id="p3-active" onchange="managePlayerRow(3)"> 3. Takımı Aç (Yeşil)</label>
            <div id="p3-inputs" style="display: none; align-items: center; gap: 8px; margin-top: 6px;">
                <input type="text" id="p3-name" placeholder="Player 3">
                <label class="bot-lbl"><input type="checkbox" id="p3-bot"> Bot yap</label>
            </div>
        </div>

        <div class="setup-row p4">
            <label style="cursor:pointer;"><input type="checkbox" id="p4-active" onchange="managePlayerRow(4)"> 4. Takımı Aç (Sarı)</label>
            <div id="p4-inputs" style="display: none; align-items: center; gap: 8px; margin-top: 6px;">
                <input type="text" id="p4-name" placeholder="Player 4">
                <label class="bot-lbl"><input type="checkbox" id="p4-bot"> Bot yap</label>
            </div>
        </div>

        <button class="btn-start" onclick="initLudoGame()">Oyunu Başlat 🚀</button>
    </div>

    <div id="game-container">
        <div id="status-bar">Sıra Kimde?</div>
        
        <div id="ludo-board"></div>

        <div id="control-panel">
            <button id="dice-btn" onclick="executeDiceRoll()">Zar At 🎲</button>
            <div id="dice-result-box">
                <span>Zar:</span>
                <div id="dice-cube" class="dice-graphic">-</div>
            </div>
        </div>
    </div>

    <audio id="sound-dice" src="https://assets.mixkit.co/active_storage/sfx/2014/2014-84.wav"></audio>
    <audio id="sound-eat" src="https://assets.mixkit.co/active_storage/sfx/2511/2511-84.wav"></audio> 
    <audio id="sound-home" src="https://assets.mixkit.co/active_storage/sfx/1435/1435-84.wav"></audio>

    <script>
        let players = [];
        let activeTurnIndex = 0;
        let diceVal = 0;
        let rollDone = false;
        let consecutiveSixes = 0;
        
        // 52 Ortak Pist Kare Koordinatları
        const trackCoordinates = [
            {r:6, c:1}, {r:6, c:2}, {r:6, c:3}, {r:6, c:4}, {r:6, c:5},
            {r:5, c:6}, {r:4, c:6}, {r:3, c:6}, {r:2, c:6}, {r:1, c:6}, {r:0, c:6},
            {r:0, c:7},
            {r:0, c:8}, {r:1, c:8}, {r:2, c:8}, {r:3, c:8}, {r:4, c:8}, {r:5, c:8},
            {r:6, c:9}, {r:6, c:10}, {r:6, c:11}, {r:6, c:12}, {r:6, c:13}, {r:6, c:14},
            {r:7, c:14},
            {r:8, c:14}, {r:8, c:13}, {r:8, c:12}, {r:8, c:11}, {r:8, c:10}, {r:8, c:9},
            {r:9, c:8}, {r:10, c:8}, {r:11, c:8}, {r:12, c:8}, {r:13, c:8}, {r:14, c:8},
            {r:14, c:7},
            {r:14, c:6}, {r:13, c:6}, {r:12, c:6}, {r:11, c:6}, {r:10, c:6}, {r:9, c:6},
            {r:8, c:5}, {r:8, c:4}, {r:8, c:3}, {r:8, c:2}, {r:8, c:1}, {r:8, c:0},
            {r:7, c:0}, {r:6, c:0}
        ];

        // Takım Özellikleri ve Koruma Noktaları (Çıkış Noktası ve Çıkıştan Sonraki 9. Kare İndisleri)
        const teamConfigs = {
            'red':    { startTrackIdx: 0,  colorClass: 'c-red',    startR: 6, startC: 1,  starTrackIdx: 9 },
            'green':  { startTrackIdx: 12, colorClass: 'c-green',  startR: 1, startC: 8,  starTrackIdx: 21 },
            'yellow': { startTrackIdx: 24, colorClass: 'c-yellow', startR: 8, startC: 13, starTrackIdx: 33 },
            'blue':   { startTrackIdx: 36, colorClass: 'c-blue',   startR: 13, startC: 6, starTrackIdx: 45 }
        };

        const diceFaces = ["", "⚀", "⚁", "⚂", "⚃", "⚄", "⚅"];

        function managePlayerRow(num) {
            const isChecked = document.getElementById(`p${num}-active`).checked;
            document.getElementById(`p${num}-inputs`).style.display = isChecked ? 'flex' : 'none';
        }

        // HARİTA VE YILDIZLI KARELERİN BAĞLANMASI
        function renderLudoBoard() {
            const boardEl = document.getElementById('ludo-board');
            boardEl.innerHTML = "";

            // Yıldızlı koordinat listesini çıkaralım
            const starCoords = Object.values(teamConfigs).map(conf => trackCoordinates[conf.starTrackIdx]);

            for (let r = 0; r < 15; r++) {
                for (let c = 0; c < 15; c++) {
                    if (r < 6 && c < 6) { if (r === 0 && c === 0) buildNestElement(boardEl, 'green', 'nest-green'); continue; }
                    if (r < 6 && c > 8) { if (r === 0 && c === 9) buildNestElement(boardEl, 'yellow', 'nest-yellow'); continue; }
                    if (r > 8 && c < 6) { if (r === 9 && c === 0) buildNestElement(boardEl, 'red', 'nest-red'); continue; }
                    if (r > 8 && c > 8) { if (r === 9 && c === 9) buildNestElement(boardEl, 'blue', 'nest-blue'); continue; }

                    if (r >= 6 && r <= 8 && c >= 6 && c <= 8) {
                        if (r === 6 && c === 6) buildCenterTriangles(boardEl);
                        continue;
                    }

                    let cell = document.createElement('div');
                    cell.className = "cell c-white";
                    cell.id = `cell-${r}-${c}`;

                    // Renkli kulvar yolları
                    if (r === 7 && c >= 1 && c <= 5) cell.className = "cell c-red";
                    if (c === 7 && r >= 1 && r <= 5) cell.className = "cell c-green";
                    if (r === 7 && c >= 9 && c <= 13) cell.className = "cell c-yellow";
                    if (c === 7 && r >= 9 && r <= 13) cell.className = "cell c-blue";

                    // Başlangıç kareleri
                    if (r === 6 && c === 1) cell.className = "cell c-red";
                    if (r === 1 && c === 8) cell.className = "cell c-green";
                    if (r === 8 && c === 13) cell.className = "cell c-yellow";
                    if (r === 13 && c === 6) cell.className = "cell c-blue";

                    // Çıkıştan sonraki 9. karelere Yıldız ekle
                    let isStar = starCoords.some(coord => coord.r === r && coord.c === c);
                    if (isStar) {
                        cell.classList.add('star-cell');
                    }

                    boardEl.appendChild(cell);
                }
            }
        }

        function buildNestElement(parent, colorName, className) {
            let nest = document.createElement('div');
            nest.className = `nest ${className}`;
            nest.id = `nest-${colorName}`;
            for (let i = 0; i < 4; i++) {
                let pocket = document.createElement('div');
                pocket.className = "pocket";
                pocket.id = `pocket-${colorName}-${i}`;
                nest.appendChild(pocket);
            }
            parent.appendChild(nest);
        }

        function buildCenterTriangles(parent) {
            let container = document.createElement('div');
            container.className = "center-triangle-container";
            container.innerHTML = `
                <svg class="triangle-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
                    <polygon points="0,0 50,50 0,100" fill="#ff4d4d" stroke="#bdc3c7" stroke-width="0.5"/>
                    <polygon points="0,0 50,50 100,0" fill="#2ecc71" stroke="#bdc3c7" stroke-width="0.5"/>
                    <polygon points="100,0 50,50 100,100" fill="#f1c40f" stroke="#bdc3c7" stroke-width="0.5"/>
                    <polygon points="0,100 50,50 100,100" fill="#3399ff" stroke="#bdc3c7" stroke-width="0.5"/>
                </svg>
                <div class="home-target-zone target-red" id="target-red"></div>
                <div class="home-target-zone target-green" id="target-green"></div>
                <div class="home-target-zone target-yellow" id="target-yellow"></div>
                <div class="home-target-zone target-blue" id="target-blue"></div>
            `;
            parent.appendChild(container);
        }

        function initLudoGame() {
            renderLudoBoard();
            players = [];

            let p1Name = document.getElementById('p1-name').value.trim() || "Yusuf";
            let p2Name = document.getElementById('p2-name').value.trim() || "player2";

            players.push({ id: 1, name: p1Name, color: 'red', label: 'Kırmızı', isBot: document.getElementById('p1-bot').checked });
            players.push({ id: 2, name: p2Name, color: 'blue', label: 'Mavi', isBot: document.getElementById('p2-bot').checked });

            if (document.getElementById('p3-active').checked) {
                let p3Name = document.getElementById('p3-name').value.trim() || "player3";
                players.push({ id: 3, name: p3Name, color: 'green', label: 'Yeşil', isBot: document.getElementById('p3-bot').checked });
            }
            if (document.getElementById('p4-active').checked) {
                let p4Name = document.getElementById('p4-name').value.trim() || "player4";
                players.push({ id: 4, name: p4Name, color: 'yellow', label: 'Sarı', isBot: document.getElementById('p4-bot').checked });
            }

            players.forEach(p => {
                p.pawns = [];
                for (let i = 0; i < 4; i++) {
                    p.pawns.push({ id: i, step: -1, isFinished: false });
                    let pawnEl = document.createElement('div');
                    pawnEl.className = `pawn pawn-${p.color}`;
                    pawnEl.id = `pawn-${p.color}-${i}`;
                    pawnEl.onclick = () => onPawnClicked(p, i);
                    document.getElementById(`pocket-${p.color}-${i}`).appendChild(pawnEl);
                }
            });

            document.getElementById('settings-menu').style.display = 'none';
            document.getElementById('game-container').style.display = 'block';

            activeTurnIndex = 0;
            consecutiveSixes = 0;
            rollDone = false;
            triggerTurnSetup();
        }

        function triggerTurnSetup() {
            let p = players[activeTurnIndex];
            let status = document.getElementById('status-bar');
            status.innerHTML = `Sıra: <span style="color:${p.color==='yellow'?'#f1c40f':(p.color==='blue'?'#3399ff':'#ff4d4d')}">${p.name}</span> takımında!`;
            rollDone = false;

            if (p.isBot) {
                document.getElementById('dice-btn').disabled = true;
                setTimeout(() => { executeDiceRoll(); }, 1200);
            } else {
                document.getElementById('dice-btn').disabled = false;
            }
        }

        function executeDiceRoll() {
            if (rollDone) return;
            document.getElementById('sound-dice').play();

            diceVal = Math.floor(Math.random() * 6) + 1;
            document.getElementById('dice-cube').innerText = diceFaces[diceVal];
            rollDone = true;

            let p = players[activeTurnIndex];

            if (diceVal === 6) {
                consecutiveSixes++;
                if (consecutiveSixes === 3) {
                    alert(`🚨 Üst üste 3 kez 6 attığın için elin yandı! Sıra diğer oyuncuda.`);
                    consecutiveSixes = 0;
                    setTimeout(switchTurn, 1200);
                    return;
                }
            } else {
                consecutiveSixes = 0;
            }

            let moveablePawns = getMoveablePawns(p, diceVal);

            if (moveablePawns.length === 0) {
                setTimeout(switchTurn, 1200);
            } else {
                if (p.isBot) {
                    setTimeout(() => { onPawnClicked(p, moveablePawns[0]); }, 1000);
                } else {
                    moveablePawns.forEach(pawnId => {
                        document.getElementById(`pawn-${p.color}-${pawnId}`).classList.add('movable');
                    });
                }
            }
        }

        function getMoveablePawns(player, dice) {
            let list = [];
            player.pawns.forEach((pawn, idx) => {
                if (pawn.isFinished) return;
                if (pawn.step === -1 && dice === 6) {
                    list.push(idx);
                } else if (pawn.step >= 0) {
                    if (pawn.step + dice <= 56) {
                        list.push(idx);
                    }
                }
            });
            return list;
        }

        function onPawnClicked(player, pawnId) {
            if (!rollDone || players[activeTurnIndex].color !== player.color) return;

            let pawn = player.pawns[pawnId];
            let moveableList = getMoveablePawns(player, diceVal);
            if (!moveableList.includes(pawnId)) return;

            moveableList.forEach(id => {
                document.getElementById(`pawn-${player.color}-${id}`).classList.remove('movable');
            });

            if (pawn.step === -1 && diceVal === 6) {
                pawn.step = 0; 
                relocatePawnOnScreen(player.color, pawnId, 0);
                document.getElementById('sound-home').play();
                rollDone = false;
                triggerTurnSetup();
                return;
            }

            if (pawn.step >= 0) {
                pawn.step += diceVal;
                relocatePawnOnScreen(player.color, pawnId, pawn.step);
                
                if (diceVal === 6) {
                    rollDone = false;
                    triggerTurnSetup();
                } else {
                    switchTurn();
                }
            }
        }

        // PİYONLARIN YERLEŞİMİ VE GELİŞMİŞ GÜVENLİK/BLOK KONTROLLERİ
        function relocatePawnOnScreen(color, pawnId, step) {
            let pawnEl = document.getElementById(`pawn-${color}-${pawnId}`);
            let conf = teamConfigs[color];
            
            if (step === 56) {
                document.getElementById(`target-${color}`).appendChild(pawnEl);
                players.find(p => p.color === color).pawns[pawnId].isFinished = true;
                document.getElementById('sound-home').play();
                checkVictoryCondition();
                reorganizeCellStack(pawnEl.parentElement); // Ayrıldığı kareyi düzenle
                return;
            }

            let targetCellEl;

            // Güvenli İç Kulvar Şeridi
            if (step > 50) {
                let safeStep = step - 50; 
                if (color === 'red')    targetCellEl = document.getElementById(`cell-7-${safeStep}`);
                if (color === 'green')  targetCellEl = document.getElementById(`cell-${safeStep}-7`);
                if (color === 'yellow') targetCellEl = document.getElementById(`cell-7-${14 - safeStep}`);
                if (color === 'blue')   targetCellEl = document.getElementById(`cell-${14 - safeStep}-7`);
            } 
            // Normal Ortak Yol
            else {
                let actualTrackIndex = (conf.startTrackIdx + step) % 52;
                let coord = trackCoordinates[actualTrackIndex];
                targetCellEl = document.getElementById(`cell-${coord.r}-${coord.c}`);
                
                // GÜVENLİK KONTROLLERİ
                let isStartSpot = (coord.r === conf.startR && coord.c === conf.startC); // Kendi çıkış noktası mı?
                let isStarSpot = (actualTrackIndex === conf.starTrackIdx); // Herhangi bir takımın 9. yıldız karesi mi?

                if (targetCellEl.children.length > 0) {
                    let existingPawns = Array.from(targetCellEl.children);
                    let samplePawn = existingPawns[0];

                    // Kural A: Karede rakip piyonlar var mı?
                    if (!samplePawn.id.includes(`pawn-${color}`)) {
                        // Eğer rakip güvenli noktadaysa VEYA karede birden fazla piyonu varsa (BLOK yapıldıysa) KIRILAMAZ!
                        let isOpponentSafe = isStartSpot || isStarSpot || (existingPawns.length >= 2);

                        if (!isOpponentSafe) {
                            // Güvende değillerse rakip piyonu (veya piyonları) evine geri yolla
                            document.getElementById('sound-eat').play();
                            existingPawns.forEach(opPawn => {
                                let opColor = opPawn.id.split('-')[1];
                                let opPawnId = opPawn.id.split('-')[2];
                                document.getElementById(`pocket-${opColor}-${opPawnId}`).appendChild(opPawn);
                                players.find(p => p.color === opColor).pawns[opPawnId].step = -1;
                                opPawn.style.transform = "none"; // Boyutu sıfırla
                            });
                            alert(`💥 Taşlama! ${color.toUpperCase()} takımı kareyi ele geçirdi ve rakibi kırdı!`);
                        }
                    }
                }
            }

            if (targetCellEl) {
                let oldParent = pawnEl.parentElement;
                targetCellEl.appendChild(pawnEl);
                
                // Hem eski karedeki hem de yeni karedeki üst üste binen piyonları görsel olarak hizala
                reorganizeCellStack(oldParent);
                reorganizeCellStack(targetCellEl);
            }
        }

        // ÜST ÜSTE BİNEN TAŞLARI GÖRSEL OLARAK KÜÇÜLTÜP YAN YANA / ÜST ÜSTE DİZEN FONKSİYON
        function reorganizeCellStack(cellEl) {
            if (!cellEl || cellEl.classList.contains('pocket') || cellEl.classList.contains('home-target-zone')) return;
            
            let pawns = cellEl.querySelectorAll('.pawn');
            if (pawns.length === 0) return;

            if (pawns.length === 1) {
                pawns[0].style.transform = "none";
                pawns[0].style.width = "75%";
                pawns[0].style.height = "75%";
            } else if (pawns.length >= 2) {
                // Karede birden fazla piyon varsa, birbirlerini kapatmasınlar diye küçültüp yığıyoruz
                pawns.forEach((pawn, idx) => {
                    pawn.style.width = "55%";
                    pawn.style.height = "55%";
                    // Hafif kaydırma efekti ile üst üste durduklarını belli ediyoruz
                    pawn.style.transform = `translate(${idx * 4}px, ${idx * 4}px)`;
                });
            }
        }

        function switchTurn() {
            activeTurnIndex = (activeTurnIndex + 1) % players.length;
            triggerTurnSetup();
        }

        function checkVictoryCondition() {
            let activePlayer = players[activeTurnIndex];
            if (activePlayer.pawns.every(p => p.isFinished)) {
                alert(`🏆 TEBRİKLER! ${activePlayer.name.toUpperCase()} tüm piyonları hedefe ulaştırdı ve KAZANDI!`);
                location.reload();
            }
        }
    </script>
</body>
</html>
